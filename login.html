<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adventurer's Log — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<style>
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px 36px;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
.login-card .brand{font-family:var(--font-heading);font-size:18px;color:var(--accent);text-align:center;margin-bottom:4px;letter-spacing:.06em}
.login-card .subtitle{font-size:13px;color:var(--text-dim);text-align:center;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-group label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);font-weight:500;display:block;margin-bottom:5px}
.form-group input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 14px;border-radius:var(--radius-sm);outline:none;transition:.15s}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.form-group input::placeholder{color:var(--text-muted)}
.btn-login{width:100%;padding:10px;background:var(--accent);color:#0f1528;border:none;border-radius:var(--radius-sm);font-family:var(--font-heading);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;letter-spacing:.04em;margin-top:6px}
.btn-login:hover{background:var(--accent-hover)}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-error{font-size:12px;color:var(--danger);text-align:center;margin-top:12px;display:none}
.login-error.show{display:block}
.login-footer{text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted)}
</style>
</head>
<body class="login-page">
<div class="login-card">
  <div class="brand">✦ Adventurer's Log</div>
  <div class="subtitle">Sign in to continue</div>
  <form id="loginForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    <div class="login-error" id="loginError"></div>
  </form>
  <div class="login-footer">Adventurer's Log &mdash; Genshin Impact Tracker</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var btn = document.getElementById('loginBtn');
  var errEl = document.getElementById('loginError');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  errEl.classList.remove('show');
  fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    })
  }).then(function(r){
    if(!r.ok) return r.json().then(function(d){ throw new Error(d.error || 'Login failed'); });
    return r.json();
  }).then(function(){
    window.location.href = '/';
  }).catch(function(err){
    errEl.textContent = err.message;
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  });
});
</script>
</body>
</html>
