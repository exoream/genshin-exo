<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adventurer's Log — Weapons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:4px}
.stats-grid .form-group{margin-bottom:0}
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.filter-bar .summary{font-size:12px;color:var(--text-dim);margin-left:auto}
.filter-bar .summary b{color:var(--accent)}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="main-nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-brand">✦ Adventurer's Log</a>
    <div class="nav-links">
      <a href="../index.html">Dashboard</a>
      <a href="../talents/talents.html">Talents</a>
      <a href="../weapon-materials/weapon-materials.html">Weapon Mats</a>
      <a href="../artifacts/artifacts.html">Artifacts</a>
      <a href="../weapons/weapons.html" class="active">Weapons</a>
      <a href="../characters/characters.html">Characters</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div>
      <h1>Weapons</h1>
      <p>Catalog your weapons — name, image, and stats.</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-primary" id="showAddBtn">+ Add Weapon</button>
    </div>
  </div>

  <div class="card" id="formCard" style="display:none;margin-bottom:20px;">
    <div class="card-header">
      <span class="card-title" id="formTitle">Add Weapon</span>
      <button class="modal-close" id="formClose">&times;</button>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group full">
          <label>Weapon Name</label>
          <input class="form-control" id="fName" placeholder="e.g. Aquila Favonia, Staff of Homa...">
        </div>
        <div class="form-group full">
          <label>Image (URL)</label>
          <input class="form-control" id="fImage" placeholder="https://example.com/image.png (optional)">
        </div>
        <div class="form-group full">
          <label>Material (for farming schedule)</label>
          <select class="form-control" id="fMaterialId">
            <option value="">-- None --</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Stats</label>
          <div class="stats-grid">
            <div class="form-group"><label>ATK%</label><input class="form-control" type="number" step="0.1" min="0" id="sAtk" placeholder="0" value="0"></div>
            <div class="form-group"><label>CRIT DMG%</label><input class="form-control" type="number" step="0.1" min="0" id="sCdmg" placeholder="0" value="0"></div>
            <div class="form-group"><label>CRIT RATE%</label><input class="form-control" type="number" step="0.1" min="0" id="sCrate" placeholder="0" value="0"></div>
            <div class="form-group"><label>HP%</label><input class="form-control" type="number" step="0.1" min="0" id="sHp" placeholder="0" value="0"></div>
            <div class="form-group"><label>Energy Recharge%</label><input class="form-control" type="number" step="0.1" min="0" id="sEr" placeholder="0" value="0"></div>
            <div class="form-group"><label>Elemental Mastery</label><input class="form-control" type="number" step="0.1" min="0" id="sEm" placeholder="0" value="0"></div>
            <div class="form-group"><label>DEF%</label><input class="form-control" type="number" step="0.1" min="0" id="sDef" placeholder="0" value="0"></div>
          </div>
        </div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;">
        <button class="btn btn-primary" id="saveBtn">Save</button>
        <button class="btn btn-ghost" id="cancelBtn" style="display:none;">Cancel</button>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <input class="form-control" id="searchInput" placeholder="Search weapons..." style="width:200px;">
    <select class="form-control" id="typeFilter" style="width:auto;min-width:140px;">
      <option value="all">All Types</option>
      <option>Sword</option>
      <option>Claymore</option>
      <option>Polearm</option>
      <option>Bow</option>
      <option>Catalyst</option>
    </select>
    <span class="summary" id="summaryText"></span>
  </div>

  <div class="card" style="margin-top:18px;">
    <div class="card-header">
      <span class="card-title">Weapon List</span>
      <span style="font-size:12px;color:var(--text-muted)" id="listCount"></span>
    </div>
    <div class="card-body" id="listBody"></div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">
<script src="../js/data.js"></script>
<script>
var editingId = null;
var filterSearch = "", filterType = "all";

function g(){ return {
  name: document.getElementById("fName").value.trim(),
  image: document.getElementById("fImage").value.trim(),
  materialId: document.getElementById("fMaterialId").value,
  stats: {
    atk: parseFloat(document.getElementById("sAtk").value)||0,
    critDmg: parseFloat(document.getElementById("sCdmg").value)||0,
    critRate: parseFloat(document.getElementById("sCrate").value)||0,
    hp: parseFloat(document.getElementById("sHp").value)||0,
    energyRecharge: parseFloat(document.getElementById("sEr").value)||0,
    elementalMastery: parseFloat(document.getElementById("sEm").value)||0,
    defense: parseFloat(document.getElementById("sDef").value)||0
  }
};}
function v(d){
  if(!d.name){ alert("Weapon name is required!"); return false; }
  return true;
}
function reset(){
  editingId=null;
  document.getElementById("fName").value="";
  document.getElementById("fImage").value="";
  document.getElementById("fMaterialId").value="";
  ["sAtk","sCdmg","sCrate","sHp","sEr","sEm","sDef"].forEach(function(id){ document.getElementById(id).value="0"; });
  document.getElementById("formTitle").textContent="Add Weapon";
  document.getElementById("saveBtn").textContent="Save";
  document.getElementById("cancelBtn").style.display="none";
  document.getElementById("formCard").style.display="none";
}
function fill(t){
  editingId=t.id;
  document.getElementById("fName").value=t.name;
  document.getElementById("fImage").value=t.image||"";
  document.getElementById("fMaterialId").value=t.materialId||"";
  var s=t.stats||{};
  document.getElementById("sAtk").value=s.atk||0;
  document.getElementById("sCdmg").value=s.critDmg||0;
  document.getElementById("sCrate").value=s.critRate||0;
  document.getElementById("sHp").value=s.hp||0;
  document.getElementById("sEr").value=s.energyRecharge||0;
  document.getElementById("sEm").value=s.elementalMastery||0;
  document.getElementById("sDef").value=s.defense||0;
  document.getElementById("formTitle").textContent="Edit Weapon";
  document.getElementById("saveBtn").textContent="Update";
  document.getElementById("cancelBtn").style.display="inline-block";
  document.getElementById("formCard").style.display="block";
}
function save(){
  var d=g(); if(!v(d)) return;
  var p = editingId ? update("weapons", editingId, d) : create("weapons", d);
  p.then(function(){ reset(); render(); });
}
function esc(s){ return (s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }

function filterData(data){
  return data.filter(function(t){
    if(filterType!=="all" && (t.type||"")!==filterType) return false;
    if(filterSearch){
      var q=filterSearch.toLowerCase();
      if((t.name||"").toLowerCase().indexOf(q)===-1) return false;
    }
    return true;
  });
}

function render(){
  Promise.all([getAll("weapons"), getAll("weapon-materials")]).then(function(r){
    var data=r[0], mats=r[1];
    var filtered = filterData(data);
    document.getElementById("summaryText").innerHTML="<b>"+filtered.length+"</b> / "+data.length+" shown";
    document.getElementById("listCount").textContent=data.length+" items";
    var el=document.getElementById("listBody");
    if(filtered.length===0){ el.innerHTML='<div class="empty"><span style="display:block;font-size:28px;margin-bottom:8px;">⚔️</span>No weapons match your filters.</div>'; return; }
    var h='<div class="table-wrap"><table><thead><tr><th style="width:8%">Img</th><th style="width:18%">Name</th><th style="width:38%">Stats</th><th style="width:10%">Mat</th><th style="width:18%">Actions</th></tr></thead><tbody>';
    for(var i=0;i<filtered.length;i++){
      var t=filtered[i];
      var s=t.stats||{};
      var sa=[];
      if(s.atk) sa.push("ATK "+s.atk+"%");
      if(s.critDmg) sa.push("CDMG "+s.critDmg+"%");
      if(s.critRate) sa.push("CRate "+s.critRate+"%");
      if(s.hp) sa.push("HP "+s.hp+"%");
      if(s.energyRecharge) sa.push("ER "+s.energyRecharge+"%");
      if(s.elementalMastery) sa.push("EM "+s.elementalMastery);
      if(s.defense) sa.push("DEF "+s.defense+"%");
      var st=sa.length?sa.join(", "):'<span style="color:var(--text-muted)">—</span>';
      var mat=mats.find(function(m){return m.id===t.materialId;});
      h+='<tr>';
      h+='<td><div style="position:relative;display:inline-block"><span class="img-thumb" data-id="'+t.id+'" data-collection="weapons" data-image="'+(t.image||'')+'" style="cursor:pointer">'+(t.image?'<img src="'+t.image+'" alt="">':'?')+'</span><button class="img-upload-trigger" data-id="'+t.id+'" data-collection="weapons" style="position:absolute;bottom:-4px;right:-4px;width:16px;height:16px;border-radius:50%;border:2px solid var(--bg,#080c1a);background:var(--accent);color:#000;font-size:10px;line-height:12px;text-align:center;padding:0;cursor:pointer;font-weight:700">+</button></div></td>';
      h+='<td><strong>'+esc(t.name)+'</strong></td>';
      h+='<td style="font-size:12px">'+st+'</td>';
      h+='<td><span class="img-thumb" style="cursor:default">'+(mat&&mat.image?'<img src="'+mat.image+'" alt="">':(mat?mat.name.charAt(0):'?'))+'</span></td>';
      h+='<td><button class="btn btn-ghost btn-sm edit-btn" data-id="'+t.id+'">Edit</button> <button class="btn btn-danger btn-sm del-btn" data-id="'+t.id+'">Delete</button></td></tr>';
    }
    h+='</tbody></table></div>';
    el.innerHTML=h;
    el.querySelectorAll(".del-btn").forEach(function(b){ b.addEventListener("click",function(){ if(!confirm("Delete this weapon?")) return; remove("weapons",b.dataset.id).then(render); }); });
    el.querySelectorAll(".edit-btn").forEach(function(b){ b.addEventListener("click",function(){ getById("weapons",b.dataset.id).then(function(t){ if(t){ populateMaterialSelect(); fill(t); } }); }); });
    el.querySelectorAll(".img-thumb").forEach(function(el){ el.addEventListener("click",function(e){ if(e.target.closest(".img-upload-trigger")) return; var u=prompt("Image URL:",this.dataset.image||""); if(u) update("weapons",this.dataset.id,{image:u}).then(render); }); });
    el.querySelectorAll(".img-upload-trigger").forEach(function(el){ el.addEventListener("click",function(e){ e.stopPropagation(); var fi=document.getElementById("fileInput"); fi.dataset.uploadId=this.dataset.id; fi.dataset.uploadCol=this.dataset.collection; fi.click(); }); });
  });
}

function applyFilters(){
  filterSearch = document.getElementById("searchInput").value;
  filterType = document.getElementById("typeFilter").value;
  render();
}

function populateMaterialSelect(){
  getAll("weapon-materials").then(function(matList){
    var sel=document.getElementById("fMaterialId");
    var cur=sel.value;
    sel.innerHTML='<option value="">-- None --</option>';
    matList.forEach(function(m){ sel.innerHTML+='<option value="'+m.id+'"'+(m.id===cur?' selected':'')+'>'+esc(m.name)+' ('+m.region+')</option>'; });
  });
}
document.getElementById("showAddBtn").addEventListener("click",function(){ reset(); populateMaterialSelect(); document.getElementById("formCard").style.display="block"; });
document.getElementById("formClose").addEventListener("click",reset);
document.getElementById("cancelBtn").addEventListener("click",reset);
document.getElementById("saveBtn").addEventListener("click",save);
document.getElementById("searchInput").addEventListener("input",applyFilters);
document.getElementById("typeFilter").addEventListener("change",applyFilters);

document.getElementById("fileInput").addEventListener("change",function(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var base64=ev.target.result.split(",")[1];
    var id=e.target.dataset.uploadId, col=e.target.dataset.uploadCol;
    fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:base64,name:file.name})})
    .then(function(r){return r.json()}).then(function(res){
      e.target.value="";
      update(col,id,{image:res.url}).then(render);
    });
  };
  reader.readAsDataURL(file);
});

render();
</script>
</body>
</html>
