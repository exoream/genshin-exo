<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adventurer's Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1528'/%3E%3Cpath d='M32 6 C34 23 41 30 58 32 C41 34 34 41 32 58 C30 41 23 34 6 32 C23 30 30 23 32 6 Z' fill='%23d4a843'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:4px}
.stats-grid .form-group{margin-bottom:0}
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.filter-bar .summary{font-size:12px;color:var(--text-dim);margin-left:auto}
.filter-bar .summary b{color:var(--accent)}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="main-nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-brand">✦ Adventurer's Log</a>
    <div class="nav-links">
      <a href="../index.html">Dashboard</a>
      <a href="../talents/talents.html">Talents</a>
      <a href="../weapon-materials/weapon-materials.html">Weapon Mats</a>
      <a href="../artifacts/artifacts.html">Artifacts</a>
      <a href="../weapons/weapons.html" class="active">Weapons</a>
      <a href="../characters/characters.html">Characters</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div>
      <h1>Weapons</h1>
      <p>Catalog your weapons — name, image, and stats.</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-primary" id="showAddBtn">+ Add Weapon</button>
    </div>
  </div>

  <div class="card" id="formCard" style="display:none;margin-bottom:20px;">
    <div class="card-header">
      <span class="card-title" id="formTitle">Add Weapon</span>
      <button class="modal-close" id="formClose">&times;</button>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group full">
          <label>Weapon Name</label>
          <input class="form-control" id="fName" placeholder="e.g. Aquila Favonia, Staff of Homa...">
        </div>
        <div class="form-group full">
          <label>Image (URL)</label>
          <input class="form-control" id="fImage" placeholder="https://example.com/image.png (optional)">
        </div>
        <div class="form-group full">
          <label>Material (for farming schedule)</label>
          <select class="form-control" id="fMaterialId">
            <option value="">-- None --</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Type</label>
          <div style="display:flex;gap:6px">
            <select class="form-control" id="fType" style="flex:1">
              <option value="">-- Select Type --</option>
            </select>
            <button class="mgr-btn" id="typeMgrBtn" title="Manage Types">🛠</button>
          </div>
        </div>
        <div class="form-group full">
          <label>Main Stat</label>
          <div style="display:flex;gap:6px">
            <select class="form-control" id="fStatType" style="flex:1">
              <option value="">-- Select Stat --</option>
            </select>
            <button class="mgr-btn" id="statMgrBtn" title="Manage Stats">🛠</button>
          </div>
        </div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;">
        <button class="btn btn-primary" id="saveBtn">Save</button>
        <button class="btn btn-ghost" id="cancelBtn" style="display:none;">Cancel</button>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <input class="form-control" id="searchInput" placeholder="Search weapons..." style="width:200px;">
    <select class="form-control" id="typeFilter" style="width:auto;min-width:140px;">
      <option value="all">All Types</option>
    </select>
    <span class="summary" id="summaryText"></span>
  </div>

  <div class="card" style="margin-top:18px;">
    <div class="card-header">
      <span class="card-title">Weapon List</span>
      <span style="font-size:12px;color:var(--text-muted)" id="listCount"></span>
    </div>
    <div class="card-body" id="listBody"></div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<div class="modal-overlay" id="typeModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Manage Weapon Types</h2>
      <button class="modal-close" id="typeModalClose">&times;</button>
    </div>
    <div class="rm-add">
      <input class="form-control" id="newTypeInput" placeholder="New type e.g. Sword, Bow...">
      <button class="btn btn-primary" id="addTypeBtn">Add</button>
    </div>
    <div class="rm-list" id="typeList"></div>
  </div>
</div>

<div class="modal-overlay" id="statModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Manage Main Stats</h2>
      <button class="modal-close" id="statModalClose">&times;</button>
    </div>
    <div class="rm-add">
      <input class="form-control" id="newStatInput" placeholder="New stat e.g. ATK%, HP%...">
      <button class="btn btn-primary" id="addStatBtn">Add</button>
    </div>
    <div class="rm-list" id="statList"></div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/table.js"></script>
<script>
var editingId = null;
var filterSearch = "", filterType = "all";
var currentPage = 1, perPage = 10;

function g(){ return {
  name: document.getElementById("fName").value.trim(),
  image: document.getElementById("fImage").value.trim(),
  materialId: document.getElementById("fMaterialId").value,
  type: document.getElementById("fType").value,
  statType: document.getElementById("fStatType").value
};}
function v(d){
  if(!d.name){ alert("Weapon name is required!"); return false; }
  return true;
}
function reset(){
  editingId=null;
  document.getElementById("fName").value="";
  document.getElementById("fImage").value="";
  document.getElementById("fMaterialId").value="";
  document.getElementById("fType").value="";
  document.getElementById("fStatType").value="";
  document.getElementById("formTitle").textContent="Add Weapon";
  document.getElementById("saveBtn").textContent="Save";
  document.getElementById("cancelBtn").style.display="none";
  document.getElementById("formCard").style.display="none";
}
function fill(t){
  editingId=t.id;
  document.getElementById("fName").value=t.name;
  document.getElementById("fImage").value=t.image||"";
  document.getElementById("fMaterialId").value=t.materialId||"";
  document.getElementById("fType").value=t.type||"";
  document.getElementById("fStatType").value=t.statType||"";
  document.getElementById("formTitle").textContent="Edit Weapon";
  document.getElementById("saveBtn").textContent="Update";
  document.getElementById("cancelBtn").style.display="inline-block";
  document.getElementById("formCard").style.display="block";
}
function save(){
  var d=g(); if(!v(d)) return;
  var p = editingId ? update("weapons", editingId, d) : create("weapons", d);
  p.then(function(){ reset(); render(); });
}
function esc(s){ return (s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }

function filterData(data){
  return data.filter(function(t){
    if(filterType!=="all" && (t.type||"")!==filterType) return false;
    if(filterSearch){
      var q=filterSearch.toLowerCase();
      if((t.name||"").toLowerCase().indexOf(q)===-1) return false;
    }
    return true;
  });
}

function render(){
  Promise.all([getAll("weapons"), getAll("weapon-materials")]).then(function(r){
    var data=r[0], mats=r[1];
    var filtered = filterData(data);
    var totalPages = Math.ceil(filtered.length / perPage) || 1;
    if(currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * perPage;
    var pageItems = filtered.slice(start, start + perPage);
    document.getElementById("summaryText").innerHTML="<b>"+filtered.length+"</b> / "+data.length+" shown";
    document.getElementById("listCount").textContent=data.length+" items";
    var el=document.getElementById("listBody");
    if(filtered.length===0){ el.innerHTML='<div class="empty"><span style="display:block;font-size:28px;margin-bottom:8px;">⚔️</span>No weapons match your filters.</div>'; return; }
    var h='<div class="table-wrap"><table><thead><tr><th style="width:8%">Img</th><th style="width:16%">Name</th><th style="width:10%">Type</th><th style="width:30%">Stats</th><th style="width:10%">Mat</th><th style="width:18%">Actions</th></tr></thead><tbody>';
    for(var i=0;i<pageItems.length;i++){
      var t=pageItems[i];
      var st=t.statType ? '<span style="color:var(--accent);font-weight:600;">'+esc(t.statType)+'</span>' : '<span style="color:var(--text-muted)">—</span>';
      var mat=mats.find(function(m){return m.id===t.materialId;});
      h+='<tr>';
      h+='<td><div style="position:relative;display:inline-block"><span class="img-thumb" data-id="'+t.id+'" data-collection="weapons" data-image="'+(t.image||'')+'" style="cursor:pointer">'+(t.image?'<img src="'+t.image+'" alt="">':'?')+'</span><button class="img-upload-trigger" data-id="'+t.id+'" data-collection="weapons" style="position:absolute;bottom:-4px;right:-4px;width:16px;height:16px;border-radius:50%;border:2px solid var(--bg,#080c1a);background:var(--accent);color:#000;font-size:10px;line-height:12px;text-align:center;padding:0;cursor:pointer;font-weight:700">+</button></div></td>';
      h+='<td><strong>'+esc(t.name)+'</strong></td>';
      h+='<td style="font-size:12px">'+esc(t.type||'—')+'</td>';
      h+='<td style="font-size:12px">'+st+'</td>';
      h+='<td><span class="img-thumb" style="cursor:default">'+(mat&&mat.image?'<img src="'+mat.image+'" alt="">':(mat?mat.name.charAt(0):'?'))+'</span></td>';
      h+='<td><button class="btn btn-ghost btn-sm edit-btn" data-id="'+t.id+'">Edit</button><button class="btn btn-danger btn-sm del-btn" data-id="'+t.id+'">Delete</button></td></tr>';
    }
    h+='</tbody></table></div>';
    h+=buildPagination(currentPage, totalPages);
    el.innerHTML=h;
    el.querySelectorAll(".del-btn").forEach(function(b){ b.addEventListener("click",function(){ if(!confirm("Delete this weapon?")) return; remove("weapons",b.dataset.id).then(render); }); });
    el.querySelectorAll(".edit-btn").forEach(function(b){ b.addEventListener("click",function(){ getById("weapons",b.dataset.id).then(function(t){ if(t){ populateMaterialSelect(); populateStatSelect(t.statType||"").then(function(){ populateTypeSelect(t.type||"").then(function(){ fill(t); }); }); } }); }); });
    el.querySelectorAll(".img-thumb").forEach(function(el){ el.addEventListener("click",function(e){ if(e.target.closest(".img-upload-trigger")) return; var u=prompt("Image URL:",this.dataset.image||""); if(u) update("weapons",this.dataset.id,{image:u}).then(render); }); });
    el.querySelectorAll(".img-upload-trigger").forEach(function(el){ el.addEventListener("click",function(e){ e.stopPropagation(); var fi=document.getElementById("fileInput"); fi.dataset.uploadId=this.dataset.id; fi.dataset.uploadCol=this.dataset.collection; fi.click(); }); });
    bindPagination();
  });
}

function buildPagination(page, total){
  if(total <= 1) return '';
  var h = '<div class="pagination">';
  h += '<button class="btn btn-sm page-prev" data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>Prev</button>';
  var ps = [], s = Math.max(1, page - 2), e = Math.min(total, page + 2);
  if(s > 1){ ps.push(1); if(s > 2) ps.push('...'); }
  for(var p = s; p <= e; p++) ps.push(p);
  if(e < total){ if(e < total - 1) ps.push('...'); ps.push(total); }
  for(var i = 0; i < ps.length; i++){
    if(ps[i] === '...'){ h += '<span class="page-dots">…</span>'; }
    else { h += '<button class="btn btn-sm page-btn' + (ps[i] === page ? ' active' : '') + '" data-page="' + ps[i] + '">' + ps[i] + '</button>'; }
  }
  h += '<button class="btn btn-sm page-next" data-page="' + (page + 1) + '"' + (page >= total ? ' disabled' : '') + '>Next</button>';
  h += '</div>';
  return h;
}
function bindPagination(){
  document.querySelectorAll(".page-btn, .page-prev, .page-next").forEach(function(b){
    b.addEventListener("click", function(){
      var p = parseInt(this.dataset.page);
      if(!isNaN(p) && p !== currentPage){ currentPage = p; render(); }
    });
  });
}
function applyFilters(){
  currentPage = 1;
  filterSearch = document.getElementById("searchInput").value;
  filterType = document.getElementById("typeFilter").value;
  render();
}

function renderStatModal(){
  loadWeaponStats().then(function(r){
    var list=document.getElementById("statList");
    list.innerHTML='';
    r.forEach(function(stat){
      var div=document.createElement("div"); div.className="rm-item";
      div.innerHTML='<span>'+esc(stat.name)+'</span><button class="rm-del" data-id="'+stat.id+'">&times;</button>';
      list.appendChild(div);
    });
    document.querySelectorAll("#statList .rm-del").forEach(function(btn){
      btn.addEventListener("click",function(){
        if(!confirm('Delete stat "'+btn.parentElement.querySelector("span").textContent+'"?')) return;
        remove("weapon-stats", btn.dataset.id).then(function(){
          weaponStatsCache=null;
          loadWeaponStats().then(function(){
            populateStatSelect(document.getElementById("fStatType").value);
            renderStatModal();
            render();
          });
        });
      });
    });
  });
}

document.getElementById("statMgrBtn").addEventListener("click",function(){ renderStatModal(); document.getElementById("statModal").classList.add("open"); });
document.getElementById("statModalClose").addEventListener("click",function(){ document.getElementById("statModal").classList.remove("open"); });
document.getElementById("statModal").addEventListener("click",function(e){ if(e.target===this) this.classList.remove("open"); });
document.getElementById("addStatBtn").addEventListener("click",function(){
  var inp=document.getElementById("newStatInput");
  var name=inp.value.trim();
  if(!name) return;
  create("weapon-stats",{name:name}).then(function(){
    inp.value="";
    weaponStatsCache=null;
    return loadWeaponStats();
  }).then(function(){
    populateStatSelect(document.getElementById("fStatType").value);
    renderStatModal();
    render();
  });
});
document.getElementById("newStatInput").addEventListener("keydown",function(e){ if(e.key==="Enter") document.getElementById("addStatBtn").click(); });

function renderTypeModal(){
  loadWeaponTypes().then(function(r){
    var list=document.getElementById("typeList");
    list.innerHTML='';
    r.forEach(function(type){
      var div=document.createElement("div"); div.className="rm-item";
      div.innerHTML='<span>'+esc(type.name)+'</span><button class="rm-del" data-id="'+type.id+'">&times;</button>';
      list.appendChild(div);
    });
    document.querySelectorAll("#typeList .rm-del").forEach(function(btn){
      btn.addEventListener("click",function(){
        if(!confirm('Delete type "'+btn.parentElement.querySelector("span").textContent+'"?')) return;
        remove("weapon-types", btn.dataset.id).then(function(){
          weaponTypesCache=null;
          loadWeaponTypes().then(function(){
            populateTypeSelect(document.getElementById("fType").value);
            weaponTypesToSelect(document.getElementById("typeFilter"), document.getElementById("typeFilter").value, true);
            renderTypeModal();
            render();
          });
        });
      });
    });
  });
}

document.getElementById("typeMgrBtn").addEventListener("click",function(){ renderTypeModal(); document.getElementById("typeModal").classList.add("open"); });
document.getElementById("typeModalClose").addEventListener("click",function(){ document.getElementById("typeModal").classList.remove("open"); });
document.getElementById("typeModal").addEventListener("click",function(e){ if(e.target===this) this.classList.remove("open"); });
document.getElementById("addTypeBtn").addEventListener("click",function(){
  var inp=document.getElementById("newTypeInput");
  var name=inp.value.trim();
  if(!name) return;
  create("weapon-types",{name:name}).then(function(){
    inp.value="";
    weaponTypesCache=null;
    return loadWeaponTypes();
  }).then(function(){
    populateTypeSelect(document.getElementById("fType").value);
    weaponTypesToSelect(document.getElementById("typeFilter"), document.getElementById("typeFilter").value, true);
    renderTypeModal();
    render();
  });
});
document.getElementById("newTypeInput").addEventListener("keydown",function(e){ if(e.key==="Enter") document.getElementById("addTypeBtn").click(); });

loadWeaponTypes().then(function(){
  return weaponTypesToSelect(document.getElementById("typeFilter"), filterType, true);
}).then(function(){
  return populateStatSelect();
}).then(function(){ render(); });

function populateMaterialSelect(){
  getAll("weapon-materials").then(function(matList){
    var sel=document.getElementById("fMaterialId");
    var cur=sel.value;
    sel.innerHTML='<option value="">-- None --</option>';
    matList.forEach(function(m){ sel.innerHTML+='<option value="'+m.id+'"'+(m.id===cur?' selected':'')+'>'+esc(m.name)+' ('+m.region+')</option>'; });
  });
}
function populateStatSelect(selectedVal){
  return weaponStatsToSelect(document.getElementById("fStatType"), selectedVal);
}
function populateTypeSelect(selectedVal){
  return weaponTypesToSelect(document.getElementById("fType"), selectedVal, false);
}
document.getElementById("showAddBtn").addEventListener("click",function(){ reset(); populateMaterialSelect(); populateStatSelect(); populateTypeSelect(); document.getElementById("formCard").style.display="block"; });
document.getElementById("formClose").addEventListener("click",reset);
document.getElementById("cancelBtn").addEventListener("click",reset);
document.getElementById("saveBtn").addEventListener("click",save);
document.getElementById("searchInput").addEventListener("input",applyFilters);
document.getElementById("typeFilter").addEventListener("change",applyFilters);

document.getElementById("fileInput").addEventListener("change",function(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var base64=ev.target.result.split(",")[1];
    var id=e.target.dataset.uploadId, col=e.target.dataset.uploadCol;
    fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:base64,name:file.name})})
    .then(function(r){return r.json()}).then(function(res){
      e.target.value="";
      update(col,id,{image:res.url}).then(render);
    });
  };
  reader.readAsDataURL(file);
});

render();
</script>
</body>
</html>
