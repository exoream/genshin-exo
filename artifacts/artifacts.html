<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adventurer's Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1528'/%3E%3Cpath d='M32 6 C34 23 41 30 58 32 C41 34 34 41 32 58 C30 41 23 34 6 32 C23 30 30 23 32 6 Z' fill='%23d4a843'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.filter-bar .summary{font-size:12px;color:var(--text-dim);margin-left:auto}
.filter-bar .summary b{color:var(--accent)}
.region-mgr-btn{font-size:11px;padding:3px 10px;cursor:pointer;color:var(--text-dim);background:none;border:1px dashed var(--border);border-radius:4px;margin-left:6px;transition:.15s;font-family:var(--font-body)}
.region-mgr-btn:hover{color:var(--accent);border-color:var(--accent)}
.rm-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.rm-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:13px}
.rm-item .rm-del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:15px;padding:0 4px;line-height:1}
.rm-item .rm-del:hover{color:#fca5a5}
.rm-add{display:flex;gap:8px}
.rm-add input{flex:1}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="main-nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-brand">✦ Adventurer's Log</a>
    <div class="nav-links">
      <a href="../index.html">Dashboard</a>
      <a href="../talents/talents.html">Talents</a>
      <a href="../weapon-materials/weapon-materials.html">Weapon Mats</a>
      <a href="../artifacts/artifacts.html" class="active">Artifacts</a>
      <a href="../weapons/weapons.html">Weapons</a>
      <a href="../characters/characters.html">Characters</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div>
      <h1>Artifacts</h1>
      <p>Manage artifact sets — domain, region, and image.</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-primary" id="showAddBtn">+ Add Artifact</button>
    </div>
  </div>

  <div class="card" id="formCard" style="display:none;margin-bottom:20px;">
    <div class="card-header">
      <span class="card-title" id="formTitle">Add Artifact</span>
      <button class="modal-close" id="formClose">&times;</button>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Domain Name</label>
          <input class="form-control" id="fDomain" placeholder="e.g. Domain of Blessing: Frost">
        </div>
        <div class="form-group">
          <label>Region</label>
          <div style="display:flex;gap:6px">
            <select class="form-control" id="fRegion" style="flex:1">
              <option value="">-- Select --</option>
            </select>
            <button class="region-mgr-btn" id="regionMgrBtnF" title="Manage Regions">🛠</button>
          </div>
        </div>
        <div class="form-group">
          <label>Artifact Name</label>
          <input class="form-control" id="fName" placeholder="e.g. Fragment of Harmonic Whimsy">
        </div>
        <div class="form-group full">
          <label>Image (URL)</label>
          <input class="form-control" id="fImage" placeholder="https://example.com/image.png (optional)">
        </div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px;">
        <button class="btn btn-primary" id="saveBtn">Save</button>
        <button class="btn btn-ghost" id="cancelBtn" style="display:none;">Cancel</button>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <input class="form-control" id="searchInput" placeholder="Search artifacts..." style="width:200px;">
    <select class="form-control" id="regionFilter" style="width:auto;min-width:140px;">
      <option value="all">All Regions</option>
    </select>
    <button class="region-mgr-btn" id="regionMgrBtn">🛠 Manage</button>
    <span class="summary" id="summaryText"></span>
  </div>

  <div class="card" style="margin-top:18px;">
    <div class="card-header">
      <span class="card-title">Artifact List</span>
      <span style="font-size:12px;color:var(--text-muted)" id="listCount"></span>
    </div>
    <div class="card-body" id="listBody"></div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<div class="modal-overlay" id="regionModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Manage Regions</h2>
      <button class="modal-close" id="regionModalClose">&times;</button>
    </div>
    <div class="rm-add">
      <input class="form-control" id="newRegionInput" placeholder="New region name">
      <button class="btn btn-primary" id="addRegionBtn">Add</button>
    </div>
    <div class="rm-list" id="regionList"></div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/table.js"></script>
<script>
var editingId = null;
var filterSearch = "", filterRegion = "all";
var currentPage = 1, perPage = 10;

function g(){ return {
  domain: document.getElementById("fDomain").value.trim(),
  region: document.getElementById("fRegion").value,
  name: document.getElementById("fName").value.trim(),
  image: document.getElementById("fImage").value.trim()
};}
function v(d){
  if(!d.domain){ alert("Domain name is required!"); return false; }
  if(!d.region){ alert("Select a region!"); return false; }
  if(!d.name){ alert("Artifact name is required!"); return false; }
  return true;
}
function reset(){
  editingId=null;
  ["fDomain","fRegion","fName","fImage"].forEach(function(id){ document.getElementById(id).value=""; });
  document.getElementById("formTitle").textContent="Add Artifact";
  document.getElementById("saveBtn").textContent="Save";
  document.getElementById("cancelBtn").style.display="none";
  document.getElementById("formCard").style.display="none";
}
function fill(t){
  editingId=t.id;
  document.getElementById("fDomain").value=t.domain||"";
  document.getElementById("fRegion").value=t.region;
  document.getElementById("fName").value=t.name;
  document.getElementById("fImage").value=t.image||"";
  document.getElementById("formTitle").textContent="Edit Artifact";
  document.getElementById("saveBtn").textContent="Update";
  document.getElementById("cancelBtn").style.display="inline-block";
  document.getElementById("formCard").style.display="block";
}
function save(){
  var d=g(); if(!v(d)) return;
  var p = editingId ? update("artifacts", editingId, d) : create("artifacts", d);
  p.then(function(){ reset(); render(); });
}
function esc(s){ return (s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }

function filterData(data){
  return data.filter(function(t){
    if(filterRegion!=="all" && t.region!==filterRegion) return false;
    if(filterSearch){
      var q=filterSearch.toLowerCase();
      if((t.name||"").toLowerCase().indexOf(q)===-1 && (t.domain||"").toLowerCase().indexOf(q)===-1) return false;
    }
    return true;
  });
}

function render(){
  getAll("artifacts").then(function(data){
    var filtered = filterData(data);
    var totalPages = Math.ceil(filtered.length / perPage) || 1;
    if(currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * perPage;
    var pageItems = filtered.slice(start, start + perPage);
    document.getElementById("summaryText").innerHTML="<b>"+filtered.length+"</b> / "+data.length+" shown";
    document.getElementById("listCount").textContent=data.length+" items";
    var el=document.getElementById("listBody");
    if(filtered.length===0){ el.innerHTML='<div class="empty"><span style="display:block;font-size:28px;margin-bottom:8px;">💠</span>No artifacts match your filters.</div>'; return; }
    var h='<div class="table-wrap"><table><thead><tr><th style="width:12%">Img</th><th style="width:28%">Domain</th><th style="width:22%">Artifact Name</th><th style="width:16%">Region</th><th style="width:22%">Actions</th></tr></thead><tbody>';
    for(var i=0;i<pageItems.length;i++){
      var t=pageItems[i];
      h+='<tr>';
      h+='<td><div style="position:relative;display:inline-block"><span class="img-thumb" data-id="'+t.id+'" data-collection="artifacts" data-image="'+(t.image||'')+'" style="cursor:pointer">'+(t.image?'<img src="'+t.image+'" alt="">':'<span>?</span>')+'</span><button class="img-upload-trigger" data-id="'+t.id+'" data-collection="artifacts" style="position:absolute;bottom:-4px;right:-4px;width:16px;height:16px;border-radius:50%;border:2px solid var(--bg,#080c1a);background:var(--accent);color:#000;font-size:10px;line-height:12px;text-align:center;padding:0;cursor:pointer;font-weight:700">+</button></div></td>';
      h+='<td>'+(t.domain||'—')+'</td><td>'+(t.name||'—')+'</td><td>'+t.region+'</td>';
      h+='<td><button class="btn btn-ghost btn-sm edit-btn" data-id="'+t.id+'">Edit</button><button class="btn btn-danger btn-sm del-btn" data-id="'+t.id+'">Delete</button></td></tr>';
    }
    h+='</tbody></table></div>';
    h+=buildPagination(currentPage, totalPages);
    el.innerHTML=h;
    el.querySelectorAll(".del-btn").forEach(function(b){ b.addEventListener("click",function(){ if(!confirm("Delete this artifact?")) return; remove("artifacts",b.dataset.id).then(render); }); });
    el.querySelectorAll(".edit-btn").forEach(function(b){ b.addEventListener("click",function(){ getById("artifacts",b.dataset.id).then(function(t){ if(t) fill(t); }); }); });
    el.querySelectorAll(".img-thumb").forEach(function(el){ el.addEventListener("click",function(e){ if(e.target.closest(".img-upload-trigger")) return; var u=prompt("Image URL:",this.dataset.image||""); if(u) update("artifacts",this.dataset.id,{image:u}).then(render); }); });
    el.querySelectorAll(".img-upload-trigger").forEach(function(el){ el.addEventListener("click",function(e){ e.stopPropagation(); var fi=document.getElementById("fileInput"); fi.dataset.uploadId=this.dataset.id; fi.dataset.uploadCol=this.dataset.collection; fi.click(); }); });
    bindPagination();
  });
}

function buildPagination(page, total){
  if(total <= 1) return '';
  var h = '<div class="pagination">';
  h += '<button class="btn btn-sm page-prev" data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>Prev</button>';
  var ps = [], s = Math.max(1, page - 2), e = Math.min(total, page + 2);
  if(s > 1){ ps.push(1); if(s > 2) ps.push('...'); }
  for(var p = s; p <= e; p++) ps.push(p);
  if(e < total){ if(e < total - 1) ps.push('...'); ps.push(total); }
  for(var i = 0; i < ps.length; i++){
    if(ps[i] === '...'){ h += '<span class="page-dots">…</span>'; }
    else { h += '<button class="btn btn-sm page-btn' + (ps[i] === page ? ' active' : '') + '" data-page="' + ps[i] + '">' + ps[i] + '</button>'; }
  }
  h += '<button class="btn btn-sm page-next" data-page="' + (page + 1) + '"' + (page >= total ? ' disabled' : '') + '>Next</button>';
  h += '</div>';
  return h;
}
function bindPagination(){
  document.querySelectorAll(".page-btn, .page-prev, .page-next").forEach(function(b){
    b.addEventListener("click", function(){
      var p = parseInt(this.dataset.page);
      if(!isNaN(p) && p !== currentPage){ currentPage = p; render(); }
    });
  });
}
function applyFilters(){
  currentPage = 1;
  filterSearch = document.getElementById("searchInput").value;
  filterRegion = document.getElementById("regionFilter").value;
  render();
}

document.getElementById("showAddBtn").addEventListener("click",function(){ reset(); document.getElementById("formCard").style.display="block"; });
document.getElementById("formClose").addEventListener("click",reset);
document.getElementById("cancelBtn").addEventListener("click",reset);
document.getElementById("saveBtn").addEventListener("click",save);
document.getElementById("searchInput").addEventListener("input",applyFilters);
document.getElementById("regionFilter").addEventListener("change",applyFilters);

document.getElementById("fileInput").addEventListener("change",function(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var base64=ev.target.result.split(",")[1];
    var id=e.target.dataset.uploadId, col=e.target.dataset.uploadCol;
    fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:base64,name:file.name})})
    .then(function(r){return r.json()}).then(function(res){
      e.target.value="";
      update(col,id,{image:res.url}).then(render);
    });
  };
  reader.readAsDataURL(file);
});

function refreshRegionSelects(selectedRegion, selectedFilter){
  regionsToSelect(document.getElementById("fRegion"), selectedRegion||"", false);
  regionsToSelect(document.getElementById("regionFilter"), selectedFilter||filterRegion, true);
}

function renderRegionModal(){
  loadRegions().then(function(r){
    var list=document.getElementById("regionList");
    list.innerHTML='';
    r.forEach(function(reg){
      var div=document.createElement("div"); div.className="rm-item";
      div.innerHTML='<span>'+reg.name+'</span><button class="rm-del" data-id="'+reg.id+'">&times;</button>';
      list.appendChild(div);
    });
    document.querySelectorAll(".rm-del").forEach(function(btn){
      btn.addEventListener("click",function(){
        if(!confirm("Delete region \""+btn.parentElement.querySelector("span").textContent+"\"?")) return;
        remove("regions", btn.dataset.id).then(function(){
          regionsCache=null;
          loadRegions().then(function(){
            refreshRegionSelects(document.getElementById("fRegion").value, document.getElementById("regionFilter").value);
            render();
            renderRegionModal();
          });
        });
      });
    });
  });
}

document.getElementById("regionMgrBtn").addEventListener("click",function(){ renderRegionModal(); document.getElementById("regionModal").classList.add("open"); });
document.getElementById("regionMgrBtnF").addEventListener("click",function(){ renderRegionModal(); document.getElementById("regionModal").classList.add("open"); });
document.getElementById("regionModalClose").addEventListener("click",function(){ document.getElementById("regionModal").classList.remove("open"); });
document.getElementById("regionModal").addEventListener("click",function(e){ if(e.target===this) this.classList.remove("open"); });
document.getElementById("addRegionBtn").addEventListener("click",function(){
  var inp=document.getElementById("newRegionInput");
  var name=inp.value.trim();
  if(!name) return;
  create("regions",{name:name}).then(function(){
    inp.value="";
    regionsCache=null;
    return loadRegions();
  }).then(function(){
    refreshRegionSelects(document.getElementById("fRegion").value, document.getElementById("regionFilter").value);
    renderRegionModal();
    render();
  });
});
document.getElementById("newRegionInput").addEventListener("keydown",function(e){ if(e.key==="Enter") document.getElementById("addRegionBtn").click(); });

loadRegions().then(function(){
  return refreshRegionSelects("", filterRegion);
}).then(function(){ render(); });
</script>
</body>
</html>
